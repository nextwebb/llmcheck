[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "llmcheck"
version = "0.4.0"
description = "Turn bad LLM/RAG runs into local regression checks for CI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "LLMCheck" }
]
dependencies = [
  "PyYAML>=6.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0"
]

[project.scripts]
llmcheck = "llmcheck.cli:main"

[project.urls]
Source = "https://github.com/nextwebb/llmcheck"
Issues = "https://github.com/nextwebb/llmcheck/issues"
